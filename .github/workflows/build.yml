name: Build & Publish

# Per-run title so PR/CI runs are distinguishable from real publishes at a glance
# (the workflow name is always "Build & Publish"; this differentiates the runs).
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('CI · PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
      || github.event_name == 'schedule'
      && 'Publish · weekly refresh'
      || github.event_name == 'workflow_dispatch'
      && format('Publish · manual · {0}', github.ref_name)
      || format('Publish · {0}', github.ref_name) }}

on:
  push:
    branches: [develop]
    tags: ['v*']
    paths:
      - backend/**
      - frontend/**
      - docker/**
      - .version
      - .github/workflows/build.yml
  pull_request:        # build-only (no push) — required check that gates Renovate auto-merge
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * 1'   # weekly: rebuild against the latest base image (pull: true)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Route Docker Hub pulls through Google's pull-through mirror to dodge
      # docker.io rate-limits/timeouts. Covers the host daemon (frontend-build's
      # pull + qemu binfmt) and buildkit base-image pulls (buildkitd config below).
      - name: Route Docker Hub pulls via mirror.gcr.io
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          printf '[registry."docker.io"]\n  mirrors = ["mirror.gcr.io"]\n' > /tmp/buildkitd-mirror.toml

      - name: Pre-pull base image (with retry)
        run: |
          for i in 1 2 3; do
            docker pull ghcr.io/v3djg6gl/nginx-full:certbot-node && exit 0
            echo "pull failed — retry $i"; sleep 15
          done
          exit 1

      - name: Build frontend (lint + tests + dist)
        run: ./scripts/ci/frontend-build

      - id: vars
        run: |
          echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%d %T %Z')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: /tmp/buildkitd-mirror.toml

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6      # lowercases the owner (v3DJG6GL) for GHCR automatically
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true                          # weekly rebuild grabs the freshest base
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stable umbrella check for the branch ruleset. Individual job names (build,
  # and any future lint/test jobs) can change as the pipeline grows; "all-ci"
  # is the single status check to require (source: GitHub Actions), so the
  # ruleset never needs re-pointing. always() + explicit check means it always
  # reports a definitive success/failure instead of being skipped.
  all-ci:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build=${{ needs.build.result }}"
            exit 1
          fi
