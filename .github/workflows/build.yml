name: Build & Publish

on:
  push:
    branches: [develop]
    tags: ['v*']
    paths:
      - backend/**
      - frontend/**
      - docker/**
      - .version
      - .github/workflows/build.yml
  pull_request:        # build-only (no push) — required check that gates Renovate auto-merge
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * 1'   # weekly: rebuild against the latest base image (pull: true)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend (lint + tests + dist)
        run: ./scripts/ci/frontend-build

      - id: vars
        run: |
          echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%d %T %Z')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5      # lowercases the owner (v3DJG6GL) for GHCR automatically
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true                          # weekly rebuild grabs the freshest base
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stable umbrella check for the branch ruleset. Individual job names (build,
  # and any future lint/test jobs) can change as the pipeline grows; "all-ci"
  # is the single status check to require (source: GitHub Actions), so the
  # ruleset never needs re-pointing. always() + explicit check means it always
  # reports a definitive success/failure instead of being skipped.
  all-ci:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build=${{ needs.build.result }}"
            exit 1
          fi
